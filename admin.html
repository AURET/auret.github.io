<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURET — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #08080c; color: #e7e2d6; font-family: 'Inter', sans-serif; min-height: 100vh; }
  body { padding: 24px 16px 80px; }

  .gold     { color: #c9a878; }
  .gold-lt  { color: #e6cf9e; }
  .serif    { font-family: 'Cormorant Garamond', serif; }

  .wrap { max-width: 1200px; margin: 0 auto; }

  /* glass panels */
  .glass {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 18px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.08), 0 8px 30px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(160deg,
      rgba(201,168,120,0.55) 0%,
      rgba(201,168,120,0.10) 30%,
      rgba(255,255,255,0)   50%,
      rgba(201,168,120,0.10) 70%,
      rgba(201,168,120,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .glass-strong {
    background: rgba(201,168,120,0.12);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 9999px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 1px rgba(201,168,120,0.3);
    position: relative;
    overflow: hidden;
  }
  .glass-strong::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(160deg,
      rgba(201,168,120,0.7) 0%,
      rgba(201,168,120,0.2) 30%,
      rgba(255,255,255,0)   50%,
      rgba(201,168,120,0.2) 70%,
      rgba(201,168,120,0.6) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* header */
  .brand { letter-spacing: .35em; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 780px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { padding: 18px 16px; }
  .stat .lbl { font-size: 12px; letter-spacing: .2em; color: #c9a878; opacity: .85; }
  .stat .val { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #e6cf9e; margin-top: 4px; font-weight: 500; }
  .stat .sub { font-size: 12px; opacity: .55; margin-top: 2px; }

  /* form */
  .form { padding: 22px; margin-top: 20px; }
  .form h2, .table-wrap h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #e6cf9e;
    font-size: 22px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  label { display: block; font-size: 12px; color: #c9a878; margin-bottom: 4px; letter-spacing: .1em; }
  input, select, textarea {
    width: 100%;
    background: rgba(8,8,12,0.55);
    border: 1px solid rgba(201,168,120,0.25);
    color: #f1ead9;
    padding: 10px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: rgba(201,168,120,0.75);
    box-shadow: 0 0 0 3px rgba(201,168,120,0.12);
  }
  textarea { resize: vertical; min-height: 60px; }

  .row-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  button.btn {
    background: rgba(201,168,120,0.18);
    color: #e6cf9e;
    border: 1px solid rgba(201,168,120,0.5);
    padding: 10px 22px;
    border-radius: 9999px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    letter-spacing: .15em;
    transition: transform .2s, background .2s;
  }
  button.btn:hover { background: rgba(201,168,120,0.28); transform: translateY(-1px); }
  button.btn.ghost { background: transparent; }
  button.btn.danger { color:#f3a5a5; border-color: rgba(243,165,165,.4); background: rgba(243,165,165,.06); }
  button.btn.danger:hover { background: rgba(243,165,165,.14); }

  /* table */
  .table-wrap { padding: 22px; margin-top: 24px; }
  .table-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .table-tools input, .table-tools select { max-width: 240px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    padding: 10px 8px;
    color: #c9a878;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .12em;
    border-bottom: 1px solid rgba(201,168,120,0.25);
    white-space: nowrap;
  }
  tbody td {
    padding: 12px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    vertical-align: middle;
  }
  tbody tr:hover { background: rgba(201,168,120,0.04); }

  tbody tr.done td:not(.actions-cell) {
    text-decoration: line-through;
    text-decoration-color: rgba(201,168,120,0.5);
    text-decoration-thickness: 1.5px;
    opacity: .45;
  }

  .check {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 1.5px solid rgba(201,168,120,0.5);
    border-radius: 6px;
    background: rgba(8,8,12,0.55);
    cursor: pointer;
    position: relative;
    transition: background .2s, border-color .2s;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .check:hover { border-color: rgba(201,168,120,0.85); }
  .check:checked {
    background: rgba(120,220,160,.7);
    border-color: rgba(120,220,160,.9);
  }
  .check:checked::after {
    content: '';
    position: absolute;
    left: 6px; top: 2px;
    width: 6px; height: 11px;
    border: solid #08080c;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }

  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
  }
  .s-new      { background: rgba(120,170,255,.14); color:#9fc2ff; }
  .s-confirm  { background: rgba(230,207,158,.14); color:#e6cf9e; }
  .s-ship     { background: rgba(180,130,255,.14); color:#c9a5ff; }
  .s-done     { background: rgba(120,220,160,.14); color:#9fe1b8; }
  .s-cancel   { background: rgba(243,165,165,.14); color:#f3a5a5; }

  .row-btn {
    background: transparent;
    color: #c9a878;
    border: 1px solid rgba(201,168,120,0.3);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    margin-inline-end: 4px;
  }
  .row-btn:hover { background: rgba(201,168,120,0.12); }
  .row-btn.del { color:#f3a5a5; border-color: rgba(243,165,165,.3); }
  .row-btn.del:hover { background: rgba(243,165,165,.1); }

  .empty {
    text-align: center;
    padding: 40px 12px;
    color: #888;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
  }

  /* responsive table → cards on mobile */
  @media (max-width: 720px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(201,168,120,0.18);
      border-radius: 12px;
      background: rgba(255,255,255,.02);
    }
    tbody td {
      border: none;
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    tbody td::before {
      content: attr(data-label);
      color: #c9a878;
      font-size: 12px;
      letter-spacing: .1em;
    }
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(201,168,120,0.18);
    color: #e6cf9e;
    border: 1px solid rgba(201,168,120,0.5);
    padding: 10px 22px;
    border-radius: 9999px;
    backdrop-filter: blur(20px);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: .1em;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<div class="wrap">

  <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
    <div>
      <div class="serif" style="font-size:38px; color:#e6cf9e; font-weight:600;">AURET</div>
      <div class="brand gold" style="font-size:11px; margin-top:-4px;">ORDER DASHBOARD</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn ghost" id="btnExport">Export CSV</button>
      <button class="btn ghost" id="btnExportJson">Backup</button>
      <button class="btn ghost" id="btnImport">Import</button>
      <input type="file" id="fileImport" accept=".json" style="display:none"/>
    </div>
  </header>

  <!-- stats -->
  <section class="stats">
    <div class="glass stat">
      <div class="lbl">TOTAL ORDERS</div>
      <div class="val" id="stTotal">0</div>
      <div class="sub" id="stTotalSub">No orders yet</div>
    </div>
    <div class="glass stat">
      <div class="lbl">REVENUE</div>
      <div class="val"><span id="stRev">0</span> <span style="font-size:16px; opacity:.6;">DH</span></div>
      <div class="sub">Confirmed, shipped &amp; delivered</div>
    </div>
    <div class="glass stat">
      <div class="lbl">THIS MONTH</div>
      <div class="val" id="stMonth">0</div>
      <div class="sub" id="stMonthName">—</div>
    </div>
    <div class="glass stat">
      <div class="lbl">TOP PRODUCT</div>
      <div class="val serif" id="stTop" style="font-size:24px;">—</div>
      <div class="sub" id="stTopCount">—</div>
    </div>
  </section>

  <!-- form -->
  <section class="glass form">
    <h2 id="formTitle">New Order</h2>
    <form id="orderForm">
      <input type="hidden" id="fId"/>
      <div class="grid">
        <div>
          <label>DATE</label>
          <input type="date" id="fDate" required/>
        </div>
        <div>
          <label>CUSTOMER NAME</label>
          <input type="text" id="fName" placeholder="e.g. Ahmed Bennani" required/>
        </div>
        <div>
          <label>PHONE</label>
          <input type="tel" id="fPhone" placeholder="06xxxxxxxx"/>
        </div>
        <div>
          <label>CITY / ADDRESS</label>
          <input type="text" id="fCity" placeholder="Casablanca"/>
        </div>
        <div>
          <label>PRODUCT</label>
          <select id="fProduct" required>
            <option value="">— Select —</option>
            <option>Megamare</option>
            <option>Imagination</option>
            <option>Light Blue</option>
            <option>Burberry Her</option>
            <option>Roja Britannia</option>
            <option>Coco Mademoiselle</option>
            <option>L'JADID</option>
            <option value="__custom__">Other…</option>
          </select>
        </div>
        <div id="fProductOtherWrap" style="display:none;">
          <label>PRODUCT NAME</label>
          <input type="text" id="fProductOther" placeholder="Product name"/>
        </div>
        <div>
          <label>QUANTITY</label>
          <input type="number" id="fQty" min="1" value="1" required/>
        </div>
        <div>
          <label>UNIT PRICE (DH)</label>
          <input type="number" id="fPrice" min="0" step="1" placeholder="e.g. 199" required/>
        </div>
        <div>
          <label>STATUS</label>
          <select id="fStatus" required>
            <option value="New">New</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div style="grid-column: 1 / -1;">
          <label>NOTES</label>
          <textarea id="fNote" placeholder="Additional notes..."></textarea>
        </div>
      </div>
      <div class="row-actions">
        <button type="submit" class="btn" id="btnSubmit">Add Order</button>
        <button type="button" class="btn ghost" id="btnReset" style="display:none;">Cancel Edit</button>
      </div>
    </form>
  </section>

  <!-- table -->
  <section class="glass table-wrap">
    <h2>Orders</h2>
    <div class="table-tools">
      <input type="text" id="search" placeholder="Search by name, phone, product…"/>
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option>New</option>
        <option>Confirmed</option>
        <option>Shipped</option>
        <option>Delivered</option>
        <option>Cancelled</option>
      </select>
      <button class="btn danger ghost" id="btnClear" style="margin-inline-start:auto;">Clear All</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:38px;"></th>
          <th>Date</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>City</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none;">No orders yet. Add your first order above.</div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'auret_orders_v1';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const STATUS_DONE = 'Delivered';
const STATUS_NEW = 'New';

let orders = load();
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function statusClass(s) {
  return ({
    'New':'s-new',
    'Confirmed':'s-confirm',
    'Shipped':'s-ship',
    'Delivered':'s-done',
    'Cancelled':'s-cancel',
  })[s] || 's-new';
}

/* form */
const form = document.getElementById('orderForm');
const fProduct = document.getElementById('fProduct');
const fProductOtherWrap = document.getElementById('fProductOtherWrap');
const fProductOther = document.getElementById('fProductOther');

fProduct.addEventListener('change', () => {
  const other = fProduct.value === '__custom__';
  fProductOtherWrap.style.display = other ? '' : 'none';
  if (other) fProductOther.focus();
});

document.getElementById('fDate').value = todayISO();

form.addEventListener('submit', e => {
  e.preventDefault();
  const productSel = fProduct.value;
  const product = productSel === '__custom__' ? fProductOther.value.trim() : productSel;
  if (!product) { toast('Select a product'); return; }

  const data = {
    id: editingId || uid(),
    date: document.getElementById('fDate').value,
    name: document.getElementById('fName').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    city: document.getElementById('fCity').value.trim(),
    product,
    qty: parseInt(document.getElementById('fQty').value, 10) || 1,
    price: parseFloat(document.getElementById('fPrice').value) || 0,
    status: document.getElementById('fStatus').value,
    note: document.getElementById('fNote').value.trim(),
    createdAt: editingId ? (orders.find(o => o.id === editingId)?.createdAt || Date.now()) : Date.now(),
  };

  if (editingId) {
    orders = orders.map(o => o.id === editingId ? data : o);
    toast('Order updated');
  } else {
    orders.unshift(data);
    toast('Order saved');
  }
  save();
  resetForm();
  render();
});

document.getElementById('btnReset').addEventListener('click', resetForm);

function resetForm() {
  editingId = null;
  form.reset();
  document.getElementById('fDate').value = todayISO();
  document.getElementById('fQty').value = 1;
  fProductOtherWrap.style.display = 'none';
  document.getElementById('formTitle').textContent = 'New Order';
  document.getElementById('btnSubmit').textContent = 'Add Order';
  document.getElementById('btnReset').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function editOrder(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  editingId = id;
  document.getElementById('fId').value = id;
  document.getElementById('fDate').value = o.date;
  document.getElementById('fName').value = o.name;
  document.getElementById('fPhone').value = o.phone;
  document.getElementById('fCity').value = o.city;
  const known = ['Megamare','Imagination','Light Blue','Burberry Her','Roja Britannia','Coco Mademoiselle',"L'JADID"];
  if (known.includes(o.product)) {
    fProduct.value = o.product;
    fProductOtherWrap.style.display = 'none';
  } else {
    fProduct.value = '__custom__';
    fProductOtherWrap.style.display = '';
    fProductOther.value = o.product;
  }
  document.getElementById('fQty').value = o.qty;
  document.getElementById('fPrice').value = o.price;
  document.getElementById('fStatus').value = o.status;
  document.getElementById('fNote').value = o.note || '';
  document.getElementById('formTitle').textContent = 'Edit Order';
  document.getElementById('btnSubmit').textContent = 'Save Changes';
  document.getElementById('btnReset').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteOrder(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  if (!confirm(`Delete order from "${o.name}" — ${o.product}?`)) return;
  orders = orders.filter(x => x.id !== id);
  save();
  render();
  toast('Order deleted');
}

/* search & filter */
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);

/* render */
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const fst = document.getElementById('filterStatus').value;

  const visible = orders.filter(o => {
    if (fst && o.status !== fst) return false;
    if (!q) return true;
    return [o.name, o.phone, o.product, o.city, o.note].some(v => (v || '').toLowerCase().includes(q));
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('empty').style.display = visible.length ? 'none' : '';

  for (const o of visible) {
    const tr = document.createElement('tr');
    const total = (o.qty || 1) * (o.price || 0);
    const isDone = o.status === STATUS_DONE;
    if (isDone) tr.classList.add('done');
    tr.innerHTML = `
      <td data-label="Done"><input type="checkbox" class="check" data-act="check" data-id="${o.id}" ${isDone ? 'checked' : ''} title="Mark as delivered"/></td>
      <td data-label="Date">${fmtDate(o.date)}</td>
      <td data-label="Customer">${escapeHtml(o.name)}</td>
      <td data-label="Phone">${o.phone ? `<a href="tel:${escapeAttr(o.phone)}" style="color:#e6cf9e;text-decoration:none;">${escapeHtml(o.phone)}</a>` : '—'}</td>
      <td data-label="City">${escapeHtml(o.city || '—')}</td>
      <td data-label="Product" class="serif gold-lt">${escapeHtml(o.product)}</td>
      <td data-label="Qty">${o.qty}</td>
      <td data-label="Total">${total.toLocaleString('en-US')} DH</td>
      <td data-label="Status"><span class="status ${statusClass(o.status)}">${o.status}</span></td>
      <td data-label="Actions" class="actions-cell">
        <button class="row-btn" data-act="edit" data-id="${o.id}">Edit</button>
        <button class="row-btn" data-act="wa" data-id="${o.id}" ${o.phone ? '' : 'disabled style="opacity:.4;cursor:not-allowed;"'}>WhatsApp</button>
        <button class="row-btn del" data-act="del" data-id="${o.id}">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.id;
      if (b.dataset.act === 'edit') editOrder(id);
      else if (b.dataset.act === 'del') deleteOrder(id);
      else if (b.dataset.act === 'wa') sendWhatsapp(id);
    });
  });
  tbody.querySelectorAll('input[data-act="check"]').forEach(c => {
    c.addEventListener('change', () => toggleDone(c.dataset.id));
  });

  renderStats();
}

function toggleDone(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.status = (o.status === STATUS_DONE) ? STATUS_NEW : STATUS_DONE;
  save();
  render();
  toast(o.status === STATUS_DONE ? 'Marked as delivered' : 'Reopened');
}

function sendWhatsapp(id) {
  const o = orders.find(x => x.id === id);
  if (!o || !o.phone) return;
  let p = o.phone.replace(/\D/g, '');
  if (p.startsWith('0')) p = '212' + p.slice(1);
  const msg = `Hello ${o.name}, regarding your AURET order: ${o.product} (x${o.qty}). Thank you!`;
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`, '_blank');
}

function renderStats() {
  document.getElementById('stTotal').textContent = orders.length;
  document.getElementById('stTotalSub').textContent = !orders.length ? 'No orders yet'
    : orders.length === 1 ? '1 order all-time' : `${orders.length} orders all-time`;

  const revenue = orders
    .filter(o => o.status === 'Confirmed' || o.status === 'Shipped' || o.status === 'Delivered')
    .reduce((s, o) => s + (o.qty || 1) * (o.price || 0), 0);
  document.getElementById('stRev').textContent = revenue.toLocaleString('en-US');

  const now = new Date();
  const cm = now.getMonth(), cy = now.getFullYear();
  const monthOrders = orders.filter(o => {
    if (!o.date) return false;
    const [y, m] = o.date.split('-').map(Number);
    return y === cy && (m - 1) === cm;
  });
  document.getElementById('stMonth').textContent = monthOrders.length;
  document.getElementById('stMonthName').textContent = `${MONTHS[cm]} ${cy}`;

  const counts = {};
  for (const o of orders) counts[o.product] = (counts[o.product] || 0) + (o.qty || 1);
  let top = null, topC = 0;
  for (const k in counts) if (counts[k] > topC) { top = k; topC = counts[k]; }
  document.getElementById('stTop').textContent = top || '—';
  document.getElementById('stTopCount').textContent = top ? `${topC} unit${topC === 1 ? '' : 's'} sold` : '—';
}

/* escape */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* export csv */
document.getElementById('btnExport').addEventListener('click', () => {
  if (!orders.length) { toast('No orders to export'); return; }
  const head = ['Date','Name','Phone','City','Product','Quantity','Unit Price','Total','Status','Notes'];
  const rows = orders.map(o => [
    o.date, o.name, o.phone, o.city, o.product, o.qty, o.price,
    (o.qty || 1) * (o.price || 0), o.status, (o.note || '').replace(/\n/g, ' ')
  ]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, `auret-orders-${todayISO()}.csv`);
  toast('Exported');
});
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/* backup / import */
document.getElementById('btnExportJson').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(orders, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `auret-backup-${todayISO()}.json`);
  toast('Backup created');
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('Invalid format');
      if (!confirm(`Import ${data.length} orders? This will replace all current data.`)) return;
      orders = data;
      save();
      render();
      toast('Imported');
    } catch (err) {
      alert('Invalid file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('btnClear').addEventListener('click', () => {
  if (!orders.length) return;
  if (!confirm(`Delete all ${orders.length} orders? This cannot be undone.`)) return;
  if (!confirm('Final confirmation — delete everything?')) return;
  orders = [];
  save();
  render();
  toast('All orders deleted');
});

render();
</script>
